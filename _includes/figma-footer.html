<footer class="footer">
  <div class="container footer-inner">
    <span class="brand">JV<b>.</b></span>
    <p class="credits">© {{ site.time | date: "%Y" }} Jordán Villón · Fotos reales: Wikimedia Commons (licencias libres) y repositorios propios.</p>
    <div class="social">
      <a href="https://github.com/jordanvt18" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/jordanvillontorres" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:jvto18@proton.me">Email</a>
    </div>
  </div>
</footer>
<script>
  (function () {
    'use strict';
    var EMAIL = 'jvto18@proton.me';

    /* ---------- Menú móvil ---------- */
    var burger = document.querySelector('.nav-burger');
    var links = document.querySelector('.nav-links');
    if (burger && links) {
      burger.addEventListener('click', function () {
        var open = links.classList.toggle('open');
        burger.setAttribute('aria-expanded', open ? 'true' : 'false');
        burger.textContent = open ? '✕' : '☰';
      });
      links.addEventListener('click', function (e) {
        if (e.target && e.target.closest('a')) {
          links.classList.remove('open');
          burger.setAttribute('aria-expanded', 'false');
          burger.textContent = '☰';
        }
      });
    }

    /* ---------- Copiar email ---------- */
    var copyBtn = document.getElementById('copy-email');
    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        var fb = document.getElementById('copy-feedback');
        function ok() {
          if (!fb) return;
          fb.textContent = '✓ copiado';
          setTimeout(function () { fb.textContent = 'copiar'; }, 2000);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(EMAIL).then(ok);
        } else {
          var ta = document.createElement('textarea');
          ta.value = EMAIL;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); ok(); } catch (err) {}
          document.body.removeChild(ta);
        }
      });
    }

    /* ---------- Formulario de contacto ---------- */
    var form = document.getElementById('contact-form');
    if (!form) return;
    var note = document.getElementById('contact-note');
    var btn = form.querySelector('button[type="submit"]');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function setNote(kind, html) {
      if (!note) return;
      note.className = 'form-note ' + (kind || '');
      note.innerHTML = html;
      note.hidden = false;
    }

    function mailtoHref(d) {
      var subject = encodeURIComponent('Contacto desde portafolio — ' + (d.nombre || 'Mensaje'));
      var body = encodeURIComponent(
        'Nombre: ' + d.nombre + '\n' +
        'Email: ' + d.email + '\n' +
        'Interés: ' + d.rol + '\n\n' +
        d.mensaje
      );
      return 'mailto:' + EMAIL + '?subject=' + subject + '&body=' + body;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var honey = form.querySelector('input[name="_honey"]');
      if (honey && honey.value) return; // bot rellenó el honeypot

      var f = new FormData(form);
      var d = {
        nombre: (f.get('nombre') || '').trim(),
        email: (f.get('email') || '').trim(),
        rol: (f.get('rol') || '').trim(),
        mensaje: (f.get('mensaje') || '').trim()
      };

      var original = btn.textContent;
      btn.disabled = true;
      btn.textContent = '⏳ Enviando…';
      setNote('muted', 'Enviando tu mensaje…');

      fetch('https://formsubmit.co/ajax/' + EMAIL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: 'Contacto desde portafolio — ' + d.nombre,
          _template: 'table',
          _captcha: 'false',
          _replyto: d.email,
          Nombre: d.nombre,
          Email: d.email,
          'Interés': d.rol,
          Mensaje: d.mensaje
        })
      })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (j) {
          if (j && j.success === false) throw new Error(j.message || 'rechazado');
          form.reset();
          setNote('ok', '✓ Mensaje enviado. Te responderé pronto a <b>' + esc(d.email) + '</b>.');
        })
        .catch(function () {
          setNote('err',
            'No se pudo enviar automáticamente. ' +
            '<a href="' + mailtoHref(d) + '">Ábrelo en tu app de correo</a> ' +
            'o escríbeme directo a <a href="mailto:' + EMAIL + '">' + EMAIL + '</a>.');
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = original;
        });
    });
  })();
</script>
